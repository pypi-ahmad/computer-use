[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "computer-use-workbench"
version = "3.2.0"
description = "Open-source local Computer Use workbench. Run on your machine with your API keys."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
authors = [{ name = "Ahmad", email = "pypi.ahmad@gmail.com" }]
dependencies = [
    "anthropic==0.88.0",
    "fastapi==0.141.1",
    "google-auth==2.49.1",
    "google-genai==2.7.0",
    "httpx==0.28.1",
    "openai==2.30.0",
    "pillow==12.3.0",
    "pydantic==2.13.0",
    "pypdf==6.15.0",
    "python-docx==1.1.2",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.32",
    "uvicorn[standard]==0.35.0",
    "websockets==15.0.1",
]

[dependency-groups]
dev = [
    "mypy==1.18.2",
    "pip-audit==2.9.0",
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.0.0",
    "ruff==0.14.4",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m \"not integration\""
markers = [
    "integration: live SDK / transport integration checks that run separately from the unit suite",
    "slow: tests that are slow (timing/IO heavy); deselect with -m 'not slow'",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "frontend",
    "node_modules",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["E501", "S101", "S311", "S603", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "E402", "RUF012", "E741", "RUF015", "RUF059"]
"evals/**" = ["S", "B", "E402"]
"docker/**" = ["S"]
"backend/**" = ["S110", "S108", "S112"]
"dev.py" = ["S607"]
"scripts/**" = ["S607", "S310"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.mypy]
python_version = "3.12"
files = ["backend"]
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = false
warn_unreachable = false
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "backend.engine",
    "backend.engine.*",
    "backend.providers.*",
    "backend.infra.observability",
    "backend.loop",
    "backend.server",
]
ignore_errors = true
